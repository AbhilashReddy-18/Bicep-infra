name: Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select Environment
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

      resourceGroup:
        description: Existing Resource Group Name
        required: true
        type: string

permissions:
  contents: read

env:
  TEMPLATE_FILE: main.bicep

jobs:

  validate:

    runs-on: ubuntu-latest

    env:
      PARAM_FILE: Parameters/${{ github.event.inputs.environment }}.bicepparam
      DEPLOYMENT_NAME: infra-${{ github.event.inputs.environment }}-${{ github.run_number }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep
        run: az bicep install

      - name: Create Artifact Directory
        run: mkdir -p Artifact

      - name: Display Deployment Details
        run: |
          echo "Environment      : ${{ github.event.inputs.environment }}"
          echo "Resource Group   : ${{ github.event.inputs.resourceGroup }}"
          echo "Parameter File   : $PARAM_FILE"
          echo "Deployment Name  : $DEPLOYMENT_NAME"

      - name: Build Main Template
        run: |
          az bicep build \
            --file $TEMPLATE_FILE \
            --outfile Artifact/main.json

      - name: Validate Parameter File
        run: |
          az bicep build-params \
            --file $PARAM_FILE

      - name: ARM Validation
        run: |
          az deployment group validate \
            --resource-group ${{ github.event.inputs.resourceGroup }} \
            --template-file $TEMPLATE_FILE \
            --parameters $PARAM_FILE

      - name: What-If Analysis
        run: |
          az deployment group what-if \
            --resource-group ${{ github.event.inputs.resourceGroup }} \
            --template-file $TEMPLATE_FILE \
            --parameters $PARAM_FILE \
            > Artifact/whatif.txt

      - name: Upload Validation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            Artifact/whatif.txt
            Artifact/main.json

  deploy:

    needs: validate

    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    env:
      PARAM_FILE: Parameters/${{ github.event.inputs.environment }}.bicepparam
      DEPLOYMENT_NAME: infra-${{ github.event.inputs.environment }}-${{ github.run_number }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Artifact Directory
        run: mkdir -p Artifact

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Infrastructure
        run: |
          az deployment group create \
            --name $DEPLOYMENT_NAME \
            --resource-group ${{ github.event.inputs.resourceGroup }} \
            --template-file $TEMPLATE_FILE \
            --parameters $PARAM_FILE \
            --output json \
            > Artifact/deployment-output.json

      - name: Copy Parameter File Used
        run: |
          cp $PARAM_FILE Artifact/

      - name: Generate Deployment Metadata
        run: |
          echo "Deployment Name : $DEPLOYMENT_NAME" > Artifact/deployment-info.txt
          echo "Environment     : ${{ github.event.inputs.environment }}" >> Artifact/deployment-info.txt
          echo "Resource Group  : ${{ github.event.inputs.resourceGroup }}" >> Artifact/deployment-info.txt
          echo "Template File   : $TEMPLATE_FILE" >> Artifact/deployment-info.txt
          echo "Parameter File  : $PARAM_FILE" >> Artifact/deployment-info.txt
          echo "Branch          : ${{ github.ref_name }}" >> Artifact/deployment-info.txt
          echo "Build Number    : ${{ github.run_number }}" >> Artifact/deployment-info.txt
          echo "Run ID          : ${{ github.run_id }}" >> Artifact/deployment-info.txt
          echo "Commit SHA      : ${{ github.sha }}" >> Artifact/deployment-info.txt
          echo "Triggered By    : ${{ github.actor }}" >> Artifact/deployment-info.txt
          echo "Date            : $(date -u)" >> Artifact/deployment-info.txt

      - name: Verify Artifact Files
        run: |
          pwd
          ls -R
          ls -lah Artifact

      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: Artifact/